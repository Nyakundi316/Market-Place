name: Deploy

# Manual: pick where and what to ship. Needs repo secret FLY_API_TOKEN and, on
# each GitHub environment (staging, production), variables API_URL / WEB_URL
# (+ optional NEXT_PUBLIC_SENTRY_DSN). Staging is the same apps with a
# -staging suffix (docs/RUNBOOK.md §11).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      target:
        description: What to deploy
        type: choice
        options: [api-then-web, api, web]
        default: api-then-web

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never cut a deploy (or its migration) off halfway

env:
  DEPLOY_ENV: ${{ inputs.environment }}
  SUFFIX: ${{ inputs.environment == 'staging' && '-staging' || '' }}

jobs:
  ci-green:
    name: Require green CI on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the CI workflow counts. Reading every check run on the commit also caught
        # this workflow's own jobs, so one failed deploy blocked every retry of that commit.
        run: |
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI on ${GITHUB_SHA::7}: $state"
          test "$state" = success

  api:
    needs: ci-green
    if: inputs.target != 'web'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Check the environment's variables
        run: |
          test -n "$API_URL" -a -n "$WEB_URL" || {
            echo "::error::Set API_URL and WEB_URL on the '$DEPLOY_ENV' environment (Settings → Environments)"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The release_command in api.toml runs `prisma migrate deploy` before traffic moves.
      - run: >
          flyctl deploy --config infra/fly/api.toml --app "markethub-api$SUFFIX" --remote-only
          --env WEB_URL="$WEB_URL" --env API_URL="$API_URL"
          --env DEPLOY_ENV="$DEPLOY_ENV" --env GIT_SHA="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  web:
    needs: [ci-green, api]
    # Web ships after the API so new pages never call endpoints that aren't live yet.
    if: always() && needs.ci-green.result == 'success' && inputs.target != 'api' && (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Check the environment's variables
        run: |
          test -n "$API_URL" -a -n "$WEB_URL" || {
            echo "::error::Set API_URL and WEB_URL on the '$DEPLOY_ENV' environment (Settings → Environments)"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # DEPLOY_ENV is a build arg because robots.txt is generated at build time.
      - run: >
          flyctl deploy --config infra/fly/web.toml --app "markethub-web$SUFFIX" --remote-only
          --env WEB_URL="$WEB_URL"
          --env API_INTERNAL_URL="http://markethub-api$SUFFIX.internal:3001"
          --build-arg API_URL="$API_URL"
          --build-arg WEB_URL="$WEB_URL"
          --build-arg DEPLOY_ENV="$DEPLOY_ENV"
          --build-arg NEXT_PUBLIC_SENTRY_DSN="$SENTRY_DSN"
          --build-arg GIT_SHA="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
