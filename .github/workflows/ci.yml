name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test-only secrets: never used outside CI's throwaway services.
env:
  NODE_ENV: test
  WEB_URL: http://localhost:3000
  API_URL: http://localhost:3001
  DATABASE_URL: postgresql://markethub:markethub@localhost:5432/markethub_test?schema=public
  REDIS_URL: redis://localhost:6379/1
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdefghijklmnop
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijklmnop
  S3_ENDPOINT: http://localhost:8333
  S3_BUCKET: markethub
  S3_PRIVATE_BUCKET: markethub-private
  S3_ACCESS_KEY: markethub
  S3_SECRET_KEY: markethub-dev-secret
  S3_REGION: us-east-1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: API + browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markethub
          POSTGRES_PASSWORD: markethub
          POSTGRES_DB: markethub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markethub -d markethub_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Service containers can't take a command, so S3 (SeaweedFS, as in compose) starts here.
      - name: Start S3
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 30); do
            echo 's3.bucket.create -name markethub' \
              | docker exec -i s3 weed shell -master=127.0.0.1:9333 2>/dev/null \
              | grep -q 'created bucket' && break
            sleep 2
          done
          # ID/business documents (Phase 6 verification): no anonymous read.
          echo 's3.bucket.create -name markethub-private' | docker exec -i s3 weed shell -master=127.0.0.1:9333

      - name: API e2e (migrates the test DB first)
        run: pnpm test:e2e --filter api

      - name: Build apps
        run: pnpm build --filter api --filter web
        env:
          API_URL: http://localhost:3001

      # The admin E2E signs in as the seeded admin (test-only credentials).
      - name: Seed categories and admin
        working-directory: apps/api
        run: pnpm exec prisma db seed
        env:
          SEED_ADMIN_EMAIL: admin@markethub.local
          SEED_ADMIN_PASSWORD: ci-admin-password-0123

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          CI: 'true'
          E2E_REDIS_URL: redis://localhost:6379/1
          E2E_ADMIN_EMAIL: admin@markethub.local
          E2E_ADMIN_PASSWORD: ci-admin-password-0123

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    # Proves both Dockerfiles still build; nothing is pushed from here.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          load: true
          tags: markethub-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # The runbook's one-off commands (admin seed, load seed) run inside this image via
      # `fly ssh`. tsx must ship in it, and the image's NODE_ENV=production must stop
      # seed:load before it touches a database.
      - name: Seed scripts run inside the API image
        run: |
          out=$(docker run --rm markethub-api:ci node ./node_modules/tsx/dist/cli.mjs prisma/seed-load.ts 2>&1 || true)
          echo "$out" | grep -q 'Refusing to seed load-test users in production' || { echo "$out"; exit 1; }
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          build-args: |
            API_URL=https://api.markethub.example
            WEB_URL=https://markethub.example
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
