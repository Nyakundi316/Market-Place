# Fly.io — MarketHub web: app markethub-web (production) or markethub-web-staging.
# Normally deployed by .github/workflows/deploy.yml; by hand, from the repo root:
#   fly deploy --config infra/fly/web.toml -a <app> \
#     -e WEB_URL=https://… -e API_INTERNAL_URL=http://<api app>.internal:3001 \
#     --build-arg API_URL=https://… --build-arg WEB_URL=https://… --build-arg DEPLOY_ENV=production|staging
# Secrets: INTERNAL_API_KEY (same as the API's), SENTRY_DSN.
app = "markethub-web"
primary_region = "jnb"

[build]
  dockerfile = "../Dockerfile.web"

[env]
  NODE_ENV = "production"
  # Per environment, so passed with `fly deploy -e`: WEB_URL, and API_INTERNAL_URL
  # (http://<api app>.internal:3001) so server-side calls stay on Fly's private network.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/offline" # static, no API dependency
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
