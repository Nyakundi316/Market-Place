name: markethub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
      POSTGRES_DB: markethub
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markethub -d markethub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'

  # S3-compatible storage for uploads in dev (§1). MinIO no longer ships public
  # images, so SeaweedFS: anonymous may read, writes need presigned URLs.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the buckets. markethub-private (verification documents)
  # gets no anonymous read — see infra/seaweedfs/s3.json.
  s3-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      seaweedfs:
        condition: service_healthy
    # The master is healthy before the filer is; retry until the shell can reach it.
    entrypoint: >
      sh -c "for b in markethub markethub-private; do
               for i in $$(seq 1 30); do
                 echo \"s3.bucket.create -name $$b\" | weed shell -master=seaweedfs:9333 2>&1 | grep -qE 'created bucket|already exists' && break;
                 sleep 2;
               done;
             done"

volumes:
  pgdata:
  s3data:
